server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Cabeceras de seguridad. Importan más de lo que parece: el token de sesión vive
  # en localStorage, así que cualquier XSS equivale a tomar la cuenta. Estas cuatro
  # no pueden romper la app (no restringen de dónde carga recursos); la que sí
  # haría falta —una Content-Security-Policy— se deja fuera a propósito hasta
  # poder probarla contra la app real, porque una CSP mal puesta la rompe entera.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;               # nada de embeber el panel en un iframe ajeno
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
